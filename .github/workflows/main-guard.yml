name: Main guard (review-bypass advisory)

# WHAT THIS IS FOR
# ----------------
# This repo's review rule is "code goes through a pull request". Since 2026-10-29 that rule is
# ENFORCED by a repository ruleset (`main: reviewed and verified`) — possible only because the
# repository is public: on a private repo on the Free plan, branch protection and rulesets both
# answer 403 "Upgrade to GitHub Pro or make this repository public".
#
# The ruleset carries a deliberate BYPASS for the owner account, because config/ changes are meant
# to go straight to main from the browser (README 1.6). So exactly one hole remains, and it is
# narrow and specific: the owner's own direct pushes. This workflow covers that hole by REPORTING
# them. It cannot block — GitHub has already accepted the push by the time it runs.
#
# It is deliberately NOT noisy, because the change classes are not equal:
#
#   config/**    the documented operating path — flagged only as information, never as a bypass
#   everything   build/, functions/, .github/, Makefile and the docs can take the live edge down
#   else         or invalidate the runbook, so they are the paths this reports on
#
# A bypass is only reported when a push did NOT come from a pull request AND touched one of those
# code paths.
#
# TO CLOSE THE HOLE ENTIRELY: remove the owner bypass in Settings -> Rules, and accept that config/
# edits then need a branch and a PR. Alternatively set the repository variable
# STRICT_MAIN_GUARD=true to fail this job instead of warning — a tripwire, not a block, since a red
# run does not undo a push.
#
# WHY NOT BLOCK BY DEFAULT: GitHub has already accepted the push by the time this runs, so
# a failing job cannot prevent anything. It would only paint main red, which hides the
# builds that genuinely broke.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: was this push reviewed?
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      BEFORE: ${{ github.event.before }}
      AFTER: ${{ github.event.after }}
      STRICT: ${{ vars.STRICT_MAIN_GUARD || 'false' }}
    steps:
      # fetch-depth 0 so the BEFORE..AFTER range is available to diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the push
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          ZERO="0000000000000000000000000000000000000000"

          if [ -z "${AFTER:-}" ] || [ "$AFTER" = "$ZERO" ]; then
            echo "no push payload (manual dispatch) — nothing to audit"
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # How many pull requests does the tip commit belong to? 0 => pushed straight to main.
          # gh prints its ERROR BODY to stdout, so only trust the value when it exited 0.
          pr_count="unknown"
          if prs="$(gh api "repos/$REPO/commits/$AFTER/pulls" --jq 'length' 2>/dev/null)"; then
            pr_count="$prs"
          fi
          echo "pull requests containing $AFTER: $pr_count"
          echo "pr_count=$pr_count" >> "$GITHUB_OUTPUT"

          # Which paths this push touched. A first push (BEFORE is the zero sha) has no
          # parent to diff against, so fall back to listing the tip commit itself.
          if [ "$BEFORE" = "$ZERO" ]; then
            changed="$(git show --name-only --format= "$AFTER")"
          else
            changed="$(git diff --name-only "$BEFORE".."$AFTER")"
          fi
          printf '%s\n' "$changed" | sed '/^$/d' > "$RUNNER_TEMP/changed.txt"
          echo "--- changed paths ---"; cat "$RUNNER_TEMP/changed.txt"

          # Code paths = anything that can break the edge or the runbook. config/ is
          # deliberately excluded: direct-to-main is its designed path.
          code="$(grep -E '^(build/|functions/|\.github/|Makefile$)' "$RUNNER_TEMP/changed.txt" || true)"
          {
            echo "code_paths<<EOF"
            printf '%s\n' "$code"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$pr_count" = "0" ] && [ -n "$code" ]; then
            verdict="bypass"
          elif [ "$pr_count" = "0" ]; then
            verdict="direct-but-within-process"
          else
            verdict="reviewed"
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          echo "verdict: $verdict"

      - name: Report
        if: always()
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          PR_COUNT: ${{ steps.verdict.outputs.pr_count }}
          CODE_PATHS: ${{ steps.verdict.outputs.code_paths }}
        run: |
          set -uo pipefail
          case "$VERDICT" in
            reviewed)
              headline="Merged through a pull request — the \`ci\` gate ran on it." ;;
            direct-but-within-process)
              headline="Pushed straight to main, **operating input only** (\`config/\`). This is the documented browser path — nothing to do." ;;
            bypass)
              headline="**Code pushed straight to main without a pull request.**" ;;
            *)
              headline="Not a push — nothing to audit." ;;
          esac

          {
            echo "## Main guard"
            echo ""
            echo "$headline"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$AFTER\` |"
            echo "| pull requests containing it | $PR_COUNT |"
            echo "| verdict | \`$VERDICT\` |"
            echo ""
            if [ -n "${CODE_PATHS:-}" ]; then
              echo "Code paths changed:"
              echo ""
              echo '```'
              printf '%s\n' "$CODE_PATHS"
              echo '```'
            fi
            if [ "$VERDICT" = "bypass" ]; then
              echo ""
              echo "### Why this is only a warning"
              echo ""
              echo "GitHub cannot block this here — branch protection and rulesets are both"
              echo "unavailable on a private repo on the Free plan (the APIs answer 403). By the"
              echo "time this job runs the commit is already on \`main\`. Failing the job would"
              echo "only paint main red and hide builds that genuinely broke."
              echo ""
              echo "To make it blocking, see the header of \`.github/workflows/main-guard.yml\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

          if [ "$VERDICT" = "bypass" ]; then
            echo "::warning::code reached main outside a pull request ($AFTER) — see the run summary"
            if [ "${STRICT:-false}" = "true" ]; then
              echo "::error::STRICT_MAIN_GUARD=true and this push bypassed review"
              exit 1
            fi
          fi
