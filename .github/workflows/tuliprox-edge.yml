name: Build & Deploy Tuliprox Xtream Edge

on:
  schedule:
    # Upstream trials here last ~36h, so refresh well inside that window.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_trial:
        description: "Force a brand-new provider trial signup (only for testing the acquisition path)"
        type: boolean
        default: false
  repository_dispatch:
    types: [credentials-rotated]
  push:
    branches: [main]

concurrency:
  group: tuliprox-edge-${{ github.ref }}
  cancel-in-progress: true

env:
  TULIPROX_VERSION: v3.3.0
  PAGES_PROJECT: tuliprox-edge-gateway
  EDGE_ORIGIN: ${{ vars.EDGE_ORIGIN || 'https://tuliprox-edge-gateway.pages.dev' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to the current majors: v4/v3 still target Node 20, which GitHub is already
      # force-running on Node 24 and will eventually retire (deprecation warning in every run).
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download Tuliprox and verify checksum
        run: |
          set -euo pipefail
          BASE="https://github.com/euzu/tuliprox/releases/download/${TULIPROX_VERSION}"
          curl -fsSL -o tuliprox "$BASE/tuliprox-${TULIPROX_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o tuliprox.sha256 "$BASE/tuliprox-${TULIPROX_VERSION}-x86_64-unknown-linux-musl.sha256"
          echo "$(cut -d' ' -f1 tuliprox.sha256)  tuliprox" | sha256sum -c -
          chmod +x tuliprox
          ./tuliprox --version

      # CLIENT_* are what players log in with, so they must always exist.
      # PROVIDER_* are now OPTIONAL: the acquisition step below mints a fresh trial straight from
      # the provider's API, so a missing or expired provider account no longer stops a build.
      - name: Verify required secrets are populated
        env:
          CLIENT_USER: ${{ secrets.CLIENT_USER }}
          CLIENT_PASS: ${{ secrets.CLIENT_PASS }}
          PROVIDER_URL: ${{ secrets.PROVIDER_URL }}
          PROVIDER_USER: ${{ secrets.PROVIDER_USER }}
          PROVIDER_PASS: ${{ secrets.PROVIDER_PASS }}
        run: |
          set -euo pipefail
          missing=""
          for v in CLIENT_USER CLIENT_PASS; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::these required repository secrets are empty or unset:$missing"
            echo "Set them with: gh secret set NAME  (an empty secret is indistinguishable from an unset one at runtime)"
            exit 1
          fi
          if [ -z "${PROVIDER_USER:-}" ] || [ -z "${PROVIDER_PASS:-}" ]; then
            echo "::warning::PROVIDER_* are unset — this build will rely entirely on automatic trial acquisition"
          fi
          echo "client credentials present"

      # The repo's canonical suite, exactly as `make test` runs it locally — one entrypoint, so CI
      # and a developer's machine can never check different things. Offline by design (no network,
      # no credentials, no provider contact); the live edge is asserted after deploy instead.
      - name: Run the test suite
        run: python3 build/run_tests.py

      # Restore the credential the PREVIOUS build settled on. Repository secrets are only the
      # bootstrap and the fallback: GITHUB_TOKEN cannot rewrite a repository secret, so without
      # this the seed would silently age out and every build would mint a brand-new trial
      # (~4 signups/day) — the exact churn this design exists to avoid. Rolling key + prefix
      # restore, because a cache is immutable per key: each run saves a fresh one and restores the
      # most recent.
      - name: Restore the credential persisted by the previous build
        uses: actions/cache/restore@v4
        with:
          path: .cred
          key: provider-cred-${{ github.run_id }}
          restore-keys: provider-cred-

      # Seed the effective provider credential. A credential persisted by an earlier build wins,
      # because it is that credential's real age — not the aging secret's — that decides when the
      # next trial is due. The acquisition step overwrites these in $GITHUB_ENV when it succeeds,
      # so every later step — including Tuliprox's own ${env:PROVIDER_*} config expansion —
      # transparently uses whichever is in force.
      - name: Seed provider credentials from the persisted file or repository secrets
        env:
          PU: ${{ secrets.PROVIDER_URL }}
          PUN: ${{ secrets.PROVIDER_USER }}
          PP: ${{ secrets.PROVIDER_PASS }}
        run: |
          set -euo pipefail
          CRED="$GITHUB_WORKSPACE/.cred/provider.json"
          SOURCE="repository secrets (bootstrap)"
          # Read with python3 — already a hard dependency of this job (the acquisition script) —
          # rather than jq, so the block stays portable and is exercisable outside Actions.
          jget() { python3 -c 'import json,sys; print((json.load(open(sys.argv[1])) or {}).get(sys.argv[2]) or "")' "$1" "$2"; }
          if [ -s "$CRED" ]; then
            R_URL="$(jget "$CRED" url)"
            R_USER="$(jget "$CRED" user)"
            R_PASS="$(jget "$CRED" pass)"
            if [ -n "$R_URL" ] && [ -n "$R_USER" ] && [ -n "$R_PASS" ]; then
              PU="$R_URL"; PUN="$R_USER"; PP="$R_PASS"
              SOURCE="the credential persisted by the previous build"
            else
              echo "::warning::the persisted credential is incomplete — falling back to repository secrets"
            fi
          fi
          echo "credential source: $SOURCE"
          # Both aliases are exported: Tuliprox's config expands ${env:PROVIDER_*}, while the
          # edge/probe scripts read UPSTREAM_*. Naming them once here means no later step has to
          # re-inject a secret and silently override an acquired trial.
          {
            echo "PROVIDER_URL=$PU";  echo "PROVIDER_USER=$PUN";  echo "PROVIDER_PASS=$PP"
            echo "UPSTREAM_URL=$PU";  echo "UPSTREAM_USER=$PUN";  echo "UPSTREAM_PASS=$PP"
          } >> "$GITHUB_ENV"

      # No email, OTP, captcha or browser: the provider returns the credentials directly in its
      # own poll response. REUSES a healthy credential rather than signing up every build — a
      # signup on every 6h run would be ~4 trials/day, and that churn risks the provider treating
      # this as automated abuse and withdrawing the free trial. Non-fatal by design: a failure
      # falls back to the seeded secret, so acquisition can never break a working build.
      - name: Ensure a usable provider credential (reuse if healthy, else acquire)
        id: trial
        continue-on-error: true
        env:
          # The provider identity comes from SECRETS, never from a default in the code. This
          # repository may be public, and naming the third party here would pair a working
          # automated free-trial signup script with the provider it targets. Secrets rather than
          # variables because a variable whose value reaches a log is public on a public repo,
          # while secrets are masked — and the acquisition script prints the site it contacts.
          PROVIDER_SITE: ${{ secrets.PROVIDER_SIGNUP_SITE }}
          PANEL_URLS: ${{ secrets.PROVIDER_PANEL_URLS }}
          TRIAL_EMAIL_BASE: ${{ secrets.TRIAL_EMAIL_BASE }}
          # Renewal cadence: replace the credential once a day. Trials here last ~36h, so a 24h
          # cadence leaves ~12h of overlap — the fresh credential always lands well before the old
          # one dies, so the playlist never has a window with a dead account, and the signup rate
          # stays at ~1/day rather than ~4/day. MIN_HOURS_LEFT is only the safety floor.
          RENEW_EVERY_HOURS: ${{ vars.RENEW_EVERY_HOURS || '24' }}
          MIN_HOURS_LEFT: ${{ vars.MIN_HOURS_LEFT || '12' }}
          CRED_FILE: .cred/provider.json
        run: |
          set -euo pipefail
          if [ "${{ inputs.force_trial }}" = "true" ]; then
            echo "force_trial=true — acquiring a brand-new trial"
            python3 build/acquire_trial.py --force
          else
            python3 build/acquire_trial.py --if-needed
          fi

      - name: Adopt the fresh trial (when one was acquired)
        if: steps.trial.outputs.status == 'ok'
        env:
          T_URL: ${{ steps.trial.outputs.url }}
          T_USER: ${{ steps.trial.outputs.username }}
          T_PASS: ${{ steps.trial.outputs.password }}
          T_EXP: ${{ steps.trial.outputs.expires_at }}
        run: |
          set -euo pipefail
          {
            echo "PROVIDER_URL=$T_URL";  echo "PROVIDER_USER=$T_USER";  echo "PROVIDER_PASS=$T_PASS"
            echo "UPSTREAM_URL=$T_URL";  echo "UPSTREAM_USER=$T_USER";  echo "UPSTREAM_PASS=$T_PASS"
          } >> "$GITHUB_ENV"
          echo "adopted a fresh trial ($T_USER), expires $T_EXP"

      - name: Report which provider credential is in force
        run: |
          case "${{ steps.trial.outputs.status }}" in
            ok)     echo "provider credential: freshly acquired trial (auto-renewed)" ;;
            reused) echo "provider credential: existing trial, still healthy (reused — no signup made)" ;;
            *)      echo "::warning::acquisition did not succeed (status=${{ steps.trial.outputs.status }}) — using the credential already in force" ;;
          esac

      # Persist whatever credential this build settled on so the next run restores exactly it and
      # the 24h cadence can be measured from that credential's real age. A single writer, so it is
      # correct whichever path was taken (persisted, seeded, or freshly acquired).
      - name: Record the credential in force for the next build
        env:
          NEW_EXP: ${{ steps.trial.outputs.expires_at }}
          SOURCE: ${{ steps.trial.outputs.status }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.cred"
          CRED="$GITHUB_WORKSPACE/.cred/provider.json"
          python3 - "$CRED" <<'PY'
          import datetime as dt, json, os, sys

          path = sys.argv[1]
          user = os.environ.get("PROVIDER_USER", "")
          url = os.environ.get("PROVIDER_URL", "")
          expires = os.environ.get("NEW_EXP", "")
          acquired = dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          prev = {}
          try:
              with open(path, encoding="utf-8") as fh:
                  prev = json.load(fh) or {}
          except Exception:
              prev = {}

          if prev.get("user") == user and prev.get("url") == url:
              # The credential is unchanged, so keep its ORIGINAL acquisition time. Re-stamping
              # "now" on every build would make the account look permanently brand new, the 24h
              # cadence would never come due, and the renewal would silently never happen.
              acquired = prev.get("acquired_at") or acquired
              # A reuse reports no expiry, so carry the previously known one forward.
              expires = expires or (prev.get("expires_at") or "")

          with open(path, "w", encoding="utf-8") as fh:
              json.dump({"url": url, "user": user, "pass": os.environ.get("PROVIDER_PASS", ""),
                         "acquired_at": acquired, "expires_at": expires,
                         "source": os.environ.get("SOURCE", "")}, fh)
          print(f"recorded credential {user} (acquired {acquired}, "
                f"expires {expires or 'unknown'}, source {os.environ.get('SOURCE', '')})")
          PY

      - name: Persist the credential for the next build
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cred
          key: provider-cred-${{ github.run_id }}

      # Fetches, filters and normalises the playlist. `-H` pins the working dir to the repo,
      # otherwise Tuliprox derives its home from the binary's own location.
      - name: Run Tuliprox one-shot (Xtream in -> m3u + category map)
        # No env block on purpose: PROVIDER_* arrive from $GITHUB_ENV, so whatever credential is
        # in force (an acquired trial, else the stored secret) is what Tuliprox expands.
        run: |
          set -euo pipefail
          if [ -z "${PROVIDER_USER:-}" ] || [ -z "${PROVIDER_PASS:-}" ]; then
            echo "::error::no provider credential in force (acquisition failed and PROVIDER_* are unset)"
            exit 1
          fi
          ./tuliprox -H "$PWD" -c config/config.yml -i config/source.yml -l info
          test -s work/edge_list.m3u
          echo "channels: $(grep -c '^#EXTINF' work/edge_list.m3u)"
          test -f work/edge_list/xtream/cat_live.json

      - name: Record provider account health
        env:
          OUT_DIR: dist
          # UPSTREAM_* come from $GITHUB_ENV, so this reports on the credential actually in force.
        run: node build/probe_upstream.mjs

      # Non-fatal: a missing guide must not stop the channels from shipping.
      - name: Fetch EPG
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL --max-time 180 -A 'Mozilla/5.0' \
            "$PROVIDER_URL/xmltv.php?username=$(printf %s "$PROVIDER_USER" | jq -sRr @uri)&password=$(printf %s "$PROVIDER_PASS" | jq -sRr @uri)" \
            -o epg.xml
          ls -lh epg.xml

      - name: Build edge Xtream indexes
        env:
          WORK_DIR: work
          OUT_DIR: dist
          M3U_NAME: edge_list.m3u
          TARGET_DIR: edge_list
          EDGE_ORIGIN: ${{ env.EDGE_ORIGIN }}
          CLIENT_USER: ${{ secrets.CLIENT_USER }}
          CLIENT_PASS: ${{ secrets.CLIENT_PASS }}
          EPG_SRC: epg.xml
        run: node build/make_xtream.mjs

      - name: Assert the build leaks no provider credentials
        run: |
          set -euo pipefail
          # Gate the host ACTUALLY USED by this build, taken from $GITHUB_ENV. Reading the stored
          # secret instead would scan for a host nobody fetched from whenever an acquired trial
          # names a different panel — a silent hole in the gate.
          HOST="$(printf %s "${PROVIDER_URL:-}" | sed -E 's#^https?://##; s#/.*##')"
          if [ -n "$HOST" ] && grep -rIl -- "$HOST" dist >/dev/null 2>&1; then
            echo "::error::provider host $HOST leaked into dist/"
            grep -rIl -- "$HOST" dist
            exit 1
          fi
          echo "OK: no provider host in dist/"
          du -sh dist; find dist -type f | wc -l

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main 2>&1 \
            | grep -v "already exists" || true

      # The edge must receive the credential that ACTUALLY built this deploy — an acquired trial
      # when one was minted, otherwise the stored secret. UPSTREAM_* are read from $GITHUB_ENV.
      - name: Sync edge environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CU: ${{ secrets.CLIENT_USER }}
          CP: ${{ secrets.CLIENT_PASS }}
        run: |
          set -euo pipefail
          put() { printf '%s' "$2" | npx --yes wrangler@4 pages secret put "$1" --project-name "$PAGES_PROJECT" >/dev/null; }
          put CLIENT_USER "$CU"
          put CLIENT_PASS "$CP"
          put UPSTREAM_USER "${UPSTREAM_USER:?}"
          put UPSTREAM_PASS "${UPSTREAM_PASS:?}"
          put UPSTREAM_URL "${UPSTREAM_URL:?}"
          echo "edge env synced"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main

      - name: Smoke-test the live edge
        env:
          BASE: ${{ env.EDGE_ORIGIN }}
          CLIENT_USER: ${{ secrets.CLIENT_USER }}
          CLIENT_PASS: ${{ secrets.CLIENT_PASS }}
        run: |
          set -euo pipefail
          # Same script that gates local changes, so CI and local can never drift apart.
          sleep 10   # let the deployment propagate
          BASE="$BASE" python3 build/verify_edge.py