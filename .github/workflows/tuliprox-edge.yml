name: Build & Deploy Tuliprox Xtream Edge

on:
  schedule:
    # Every 4 hours. Trials last ~36h and a slot renews when it drops under MIN_HOURS_LEFT (6h),
    # so a 4h interval guarantees at least one more build runs while a credential is still alive —
    # a renewal can fail once and still be retried in time.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      force_trial:
        description: "Force a brand-new provider trial signup (only for testing the acquisition path)"
        type: boolean
        default: false
      prefer_manual:
        description: "Use the PROVIDER_* values configured in repo settings instead of the cached ones"
        type: boolean
        default: false
  repository_dispatch:
    types: [credentials-rotated]
  push:
    branches: [main]

concurrency:
  group: tuliprox-edge-${{ github.ref }}
  cancel-in-progress: true

env:
  TULIPROX_VERSION: v3.3.0
  PAGES_PROJECT: tuliprox-edge-gateway
  EDGE_ORIGIN: ${{ vars.EDGE_ORIGIN || 'https://tuliprox-edge-gateway.pages.dev' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the first step read repository variables so it can mask them before anything
      # else prints them. Without it the masking silently no-ops and the step says so.
      actions: read
    steps:
      # Mask the credentials BEFORE any other step can echo them.
      #
      # GitHub auto-masks repository SECRETS but NOT repository VARIABLES, and these are
      # deliberately variables so they can be read and hand-edited in the UI. Without this they
      # would appear verbatim in every later step's `env:` dump — which is exactly how a provider
      # password leaked into a run log once already. Masking is independent of the store, so the
      # readability we wanted costs nothing in log hygiene.
      # The values are FETCHED AT RUNTIME, never interpolated into this file.
      #
      # Both obvious approaches leak: an `env:` block is printed before the step's script runs
      # (so the masking cannot have happened yet), and `${{ vars.X }}` written inline is echoed
      # with expressions already expanded in the "Run ..." group. Either way the value lands in
      # the log in plaintext — which is precisely what happened on the first attempt here.
      # Reading them from the API keeps them out of both places.
      - name: Mask credentials in the log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          masked=0
          unreadable=0
          for name in CLIENT_PASS CLIENT_2_PASS CLIENT_USER CLIENT_2_USER \
                      PROVIDER_PASS PROVIDER_USER PROVIDER_URL \
                      PROVIDER_2_PASS PROVIDER_2_USER PROVIDER_2_URL; do
            # `gh api` prints its ERROR BODY TO STDOUT, so `|| true` would capture a 133-character
            # "Not Found" document and happily mask that instead of the credential — reporting
            # success while protecting nothing. Only trust stdout when gh actually exited 0.
            if val="$(gh api "repos/${GITHUB_REPOSITORY}/actions/variables/${name}" \
                        --jq .value 2>/dev/null)"; then
              # Only mask values long enough to be a credential: registering a short string makes
              # Actions redact every incidental occurrence of it and the log becomes unreadable.
              if [ -n "$val" ] && [ "${#val}" -gt 7 ]; then
                echo "::add-mask::$val"
                masked=$((masked + 1))
              fi
            else
              unreadable=$((unreadable + 1))
            fi
          done
          echo "masked $masked variable-held credential value(s); $unreadable not readable"
          if [ "$masked" -eq 0 ] && [ "$unreadable" -gt 0 ]; then
            echo "::warning::GITHUB_TOKEN cannot read repository variables, so any credential" \
                 "stored as a VARIABLE appears in plaintext in this private log. That is an" \
                 "accepted trade for being able to read and hand-edit them; move a value back to" \
                 "a SECRET (which GitHub masks automatically) if you want it hidden instead."
          fi

      # Pinned to the current majors: v4/v3 still target Node 20, which GitHub is already
      # force-running on Node 24 and will eventually retire (deprecation warning in every run).
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download Tuliprox and verify checksum
        run: |
          set -euo pipefail
          BASE="https://github.com/euzu/tuliprox/releases/download/${TULIPROX_VERSION}"
          curl -fsSL -o tuliprox "$BASE/tuliprox-${TULIPROX_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o tuliprox.sha256 "$BASE/tuliprox-${TULIPROX_VERSION}-x86_64-unknown-linux-musl.sha256"
          echo "$(cut -d' ' -f1 tuliprox.sha256)  tuliprox" | sha256sum -c -
          chmod +x tuliprox
          ./tuliprox --version

      # CLIENT_* are what players log in with, so they must always exist.
      # PROVIDER_* are now OPTIONAL: the acquisition step below mints a fresh trial straight from
      # the provider's API, so a missing or expired provider account no longer stops a build.
      - name: Verify required secrets are populated
        env:
          CLIENT_USER: ${{ vars.CLIENT_USER || secrets.CLIENT_USER }}
          CLIENT_PASS: ${{ vars.CLIENT_PASS || secrets.CLIENT_PASS }}
          CLIENT_2_USER: ${{ vars.CLIENT_2_USER || secrets.CLIENT_2_USER }}
          CLIENT_2_PASS: ${{ vars.CLIENT_2_PASS || secrets.CLIENT_2_PASS }}
          PROVIDER_URL: ${{ vars.PROVIDER_URL || secrets.PROVIDER_URL }}
          PROVIDER_USER: ${{ vars.PROVIDER_USER || secrets.PROVIDER_USER }}
          PROVIDER_PASS: ${{ vars.PROVIDER_PASS || secrets.PROVIDER_PASS }}
        run: |
          set -euo pipefail
          missing=""
          for v in CLIENT_USER CLIENT_PASS; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::these required settings are empty or unset:$missing"
            echo "Set either a repository VARIABLE (readable and editable in the UI, which is what"
            echo "you want for a playlist login you need to look up) or a SECRET (write-only):"
            echo "  gh variable set NAME --body VALUE     # or:  gh secret set NAME"
            echo "A variable wins when both exist. An empty value is indistinguishable from unset."
            exit 1
          fi
          # A half-set second login would authenticate nobody but still look configured.
          if { [ -n "${CLIENT_2_USER:-}" ] && [ -z "${CLIENT_2_PASS:-}" ]; } ||
             { [ -z "${CLIENT_2_USER:-}" ] && [ -n "${CLIENT_2_PASS:-}" ]; }; then
            echo "::error::CLIENT_2_USER and CLIENT_2_PASS must be set together (or both left unset)"
            exit 1
          fi
          if [ -z "${PROVIDER_USER:-}" ] || [ -z "${PROVIDER_PASS:-}" ]; then
            echo "::warning::PROVIDER_* are unset — this build will rely entirely on automatic trial acquisition"
          fi
          echo "client credentials present"

      # The repo's canonical suite, exactly as `make test` runs it locally — one entrypoint, so CI
      # and a developer's machine can never check different things. Offline by design (no network,
      # no credentials, no provider contact); the live edge is asserted after deploy instead.
      - name: Run the test suite
        run: python3 build/run_tests.py

      # Restore the credential the PREVIOUS build settled on. Repository secrets are only the
      # bootstrap and the fallback: GITHUB_TOKEN cannot rewrite a repository secret, so without
      # this the seed would silently age out and every build would mint a brand-new trial
      # (~4 signups/day) — the exact churn this design exists to avoid. Rolling key + prefix
      # restore, because a cache is immutable per key: each run saves a fresh one and restores the
      # most recent.
      - name: Restore the credential persisted by the previous build
        uses: actions/cache/restore@v4
        with:
          path: .cred
          key: provider-cred-${{ github.run_id }}
          restore-keys: provider-cred-

      # Seed each slot's starting credential. A credential persisted by an earlier build wins over
      # the repository secret, because it is THAT credential's real age — not the aging secret's —
      # which decides when the next trial is due. The acquisition steps overwrite these in
      # $GITHUB_ENV when they mint something, so every later step (including Tuliprox's own
      # ${env:PROVIDER_*} expansion) transparently uses whichever credential is in force.
      - name: Seed provider credentials from the persisted file or repository secrets
        env:
          CRED_FILE: .cred/provider.json
          SEED_URL: ${{ vars.PROVIDER_URL || secrets.PROVIDER_URL }}
          SEED_USER: ${{ vars.PROVIDER_USER || secrets.PROVIDER_USER }}
          SEED_PASS: ${{ vars.PROVIDER_PASS || secrets.PROVIDER_PASS }}
          SEED_2_URL: ${{ vars.PROVIDER_2_URL || secrets.PROVIDER_2_URL }}
          SEED_2_USER: ${{ vars.PROVIDER_2_USER || secrets.PROVIDER_2_USER }}
          SEED_2_PASS: ${{ vars.PROVIDER_2_PASS || secrets.PROVIDER_2_PASS }}
          PREFER_SEED: ${{ inputs.prefer_manual && '1' || '' }}
        run: python3 build/credential_state.py seed

      # No email, OTP, captcha or browser: the provider returns the credentials directly in its
      # own poll response. Each slot REUSES a healthy credential rather than signing up every
      # build — a signup per build would be several trials/day, and that churn risks the provider
      # treating this as automated abuse and withdrawing the free trial. Non-fatal by design: a
      # failure leaves the credential already in force, so acquisition can never break a build.
      #
      # Two slots exist because each trial allows max_connections=1. They share one catalogue, so
      # either can serve any channel: slot 2 is a second simultaneous viewer and a spare account.
      - name: Ensure a usable provider credential — slot 1
        id: trial
        continue-on-error: true
        env:
          TRIAL_EMAIL_BASE: ${{ vars.TRIAL_EMAIL_BASE || 'taskgobbler' }}
          RENEW_EVERY_HOURS: ${{ vars.RENEW_EVERY_HOURS || '24' }}
          MIN_HOURS_LEFT: ${{ vars.MIN_HOURS_LEFT || '6' }}
          CRED_FILE: .cred/provider.json
        run: |
          set -euo pipefail
          if [ "${{ inputs.force_trial }}" = "true" ]; then
            echo "force_trial=true — acquiring a brand-new trial for slot 1"
            python3 build/acquire_trial.py --force --slot 1
          else
            python3 build/acquire_trial.py --if-needed --slot 1
          fi

      - name: Adopt the fresh trial — slot 1
        if: steps.trial.outputs.status == 'ok'
        env:
          T_URL: ${{ steps.trial.outputs.url }}
          T_USER: ${{ steps.trial.outputs.username }}
          T_PASS: ${{ steps.trial.outputs.password }}
          T_EXP: ${{ steps.trial.outputs.expires_at }}
        run: |
          set -euo pipefail
          {
            echo "PROVIDER_URL=$T_URL";  echo "PROVIDER_USER=$T_USER";  echo "PROVIDER_PASS=$T_PASS"
            echo "UPSTREAM_URL=$T_URL";  echo "UPSTREAM_USER=$T_USER";  echo "UPSTREAM_PASS=$T_PASS"
          } >> "$GITHUB_ENV"
          echo "slot 1: adopted a fresh trial ($T_USER), expires $T_EXP"

      # Slot 2 is optional and additive. force_trial deliberately does NOT apply here: forcing two
      # signups in one run doubles the request burst for a path already proven by slot 1.
      - name: Ensure a usable provider credential — slot 2
        id: trial2
        continue-on-error: true
        env:
          TRIAL_EMAIL_BASE: ${{ vars.TRIAL_EMAIL_BASE || 'taskgobbler' }}
          RENEW_EVERY_HOURS: ${{ vars.RENEW_EVERY_HOURS || '24' }}
          MIN_HOURS_LEFT: ${{ vars.MIN_HOURS_LEFT || '6' }}
          RENEW_STAGGER_HOURS: ${{ vars.RENEW_STAGGER_HOURS || '12' }}
          CRED_FILE: .cred/provider.json
        run: python3 build/acquire_trial.py --if-needed --slot 2

      - name: Adopt the fresh trial — slot 2
        if: steps.trial2.outputs.status == 'ok'
        env:
          T_URL: ${{ steps.trial2.outputs.url }}
          T_USER: ${{ steps.trial2.outputs.username }}
          T_PASS: ${{ steps.trial2.outputs.password }}
          T_EXP: ${{ steps.trial2.outputs.expires_at }}
        run: |
          set -euo pipefail
          {
            echo "PROVIDER_2_URL=$T_URL";  echo "PROVIDER_2_USER=$T_USER";  echo "PROVIDER_2_PASS=$T_PASS"
            echo "UPSTREAM_2_URL=$T_URL";  echo "UPSTREAM_2_USER=$T_USER";  echo "UPSTREAM_2_PASS=$T_PASS"
          } >> "$GITHUB_ENV"
          echo "slot 2: adopted a fresh trial ($T_USER), expires $T_EXP"

      - name: Report which provider credentials are in force
        env:
          S1: ${{ steps.trial.outputs.status }}
          S2: ${{ steps.trial2.outputs.status }}
        run: |
          report() {
            case "$2" in
              ok)     echo "slot $1: freshly acquired trial (auto-renewed)" ;;
              reused) echo "slot $1: existing trial, still healthy (reused — no signup made)" ;;
              "")     echo "slot $1: not configured" ;;
              *)      echo "::warning::slot $1: acquisition did not succeed (status=$2) — using whatever was already in force" ;;
            esac
          }
          report 1 "$S1"
          report 2 "$S2"

      # Persist what this build settled on, per slot, so the next run can age each credential
      # independently. Also publishes UPSTREAM_HEALTHY_SLOTS from the verdicts above, which is how
      # the edge avoids handing viewers to a dead account (it cannot tell by itself: the provider
      # refuses our egress, so streams leave as redirects the edge never sees the result of).
      - name: Record the credentials in force for the next build
        env:
          CRED_FILE: .cred/provider.json
          STATUS: ${{ steps.trial.outputs.status }}
          EXPIRES: ${{ steps.trial.outputs.expires_at }}
          STATUS_2: ${{ steps.trial2.outputs.status }}
          EXPIRES_2: ${{ steps.trial2.outputs.expires_at }}
          SLOTS_SUMMARY: work/slots.json
        run: python3 build/credential_state.py record

      - name: Persist the credential for the next build
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cred
          key: provider-cred-${{ github.run_id }}

      # Fetches, filters and normalises the playlist. `-H` pins the working dir to the repo,
      # otherwise Tuliprox derives its home from the binary's own location.
      - name: Run Tuliprox one-shot (Xtream in -> m3u + category map)
        # No env block on purpose: PROVIDER_* arrive from $GITHUB_ENV, so whatever credential is
        # in force (an acquired trial, else the stored secret) is what Tuliprox expands.
        run: |
          set -euo pipefail
          if [ -z "${PROVIDER_USER:-}" ] || [ -z "${PROVIDER_PASS:-}" ]; then
            echo "::error::no provider credential in force (acquisition failed and PROVIDER_* are unset)"
            exit 1
          fi
          ./tuliprox -H "$PWD" -c config/config.yml -i config/source.yml -l info
          test -s work/edge_list.m3u
          echo "channels: $(grep -c '^#EXTINF' work/edge_list.m3u)"
          test -f work/edge_list/xtream/cat_live.json

      - name: Record provider account health
        env:
          OUT_DIR: dist
          # UPSTREAM_* come from $GITHUB_ENV, so this reports on the credential actually in force.
        run: node build/probe_upstream.mjs

      # Non-fatal: a missing guide must not stop the channels from shipping.
      - name: Fetch EPG
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -fsSL --max-time 180 -A 'Mozilla/5.0' \
            "$PROVIDER_URL/xmltv.php?username=$(printf %s "$PROVIDER_USER" | jq -sRr @uri)&password=$(printf %s "$PROVIDER_PASS" | jq -sRr @uri)" \
            -o epg.xml
          ls -lh epg.xml

      - name: Build edge Xtream indexes
        env:
          WORK_DIR: work
          OUT_DIR: dist
          M3U_NAME: edge_list.m3u
          TARGET_DIR: edge_list
          EDGE_ORIGIN: ${{ env.EDGE_ORIGIN }}
          CLIENT_USER: ${{ vars.CLIENT_USER || secrets.CLIENT_USER }}
          CLIENT_PASS: ${{ vars.CLIENT_PASS || secrets.CLIENT_PASS }}
          CLIENT_2_USER: ${{ vars.CLIENT_2_USER || secrets.CLIENT_2_USER }}
          CLIENT_2_PASS: ${{ vars.CLIENT_2_PASS || secrets.CLIENT_2_PASS }}
          EPG_SRC: epg.xml
        run: node build/make_xtream.mjs

      # Publish the redacted per-slot summary so the watchdog can see EVERY slot, not just the one
      # the catalogue was built with. It lands under _data/, which the middleware gates like any
      # other asset, and carries no credential — only slot number, health and expiry.
      - name: Publish the slot health summary
        run: |
          set -euo pipefail
          if [ -s work/slots.json ]; then
            mkdir -p dist/_data
            cp work/slots.json dist/_data/slots.json
            echo "published slot summary:"; cat dist/_data/slots.json
          else
            echo "::warning::no slot summary was produced — the monitor will fall back to slot 1 only"
          fi

      - name: Assert the build leaks no provider credentials
        run: |
          set -euo pipefail
          # Gate every host ACTUALLY USED by this build, taken from $GITHUB_ENV. Reading the
          # stored secret instead would scan for a host nobody fetched from whenever an acquired
          # trial names a different panel — a silent hole in the gate. Both slots are checked:
          # missing slot 2 here would leave its host free to leak unnoticed.
          leaked=0
          for raw in "${PROVIDER_URL:-}" "${PROVIDER_2_URL:-}"; do
            HOST="$(printf %s "$raw" | sed -E 's#^https?://##; s#/.*##')"
            [ -n "$HOST" ] || continue
            if grep -rIl -- "$HOST" dist >/dev/null 2>&1; then
              echo "::error::provider host $HOST leaked into dist/"
              grep -rIl -- "$HOST" dist
              leaked=1
            fi
          done
          [ "$leaked" -eq 0 ] || exit 1
          echo "OK: no provider host in dist/"
          du -sh dist; find dist -type f | wc -l

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main 2>&1 \
            | grep -v "already exists" || true

      # The edge must receive the credential that ACTUALLY built this deploy — an acquired trial
      # when one was minted, otherwise the stored secret. UPSTREAM_* are read from $GITHUB_ENV.
      - name: Sync edge environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CU: ${{ vars.CLIENT_USER || secrets.CLIENT_USER }}
          CP: ${{ vars.CLIENT_PASS || secrets.CLIENT_PASS }}
          C2U: ${{ vars.CLIENT_2_USER || secrets.CLIENT_2_USER }}
          C2P: ${{ vars.CLIENT_2_PASS || secrets.CLIENT_2_PASS }}
        run: |
          set -euo pipefail
          put() { printf '%s' "$2" | npx --yes wrangler@4 pages secret put "$1" --project-name "$PAGES_PROJECT" >/dev/null; }
          put CLIENT_USER "$CU"
          put CLIENT_PASS "$CP"
          # Login 2 is optional; push it only when complete so a half-set login cannot
          # authenticate and then be pinned to a slot it has no credentials for.
          if [ -n "${C2U:-}" ] && [ -n "${C2P:-}" ]; then
            put CLIENT_2_USER "$C2U"
            put CLIENT_2_PASS "$C2P"
            echo "playlist login 2 synced (second simultaneous viewer enabled)"
          else
            echo "playlist login 2 not configured — one viewer at a time"
          fi
          put UPSTREAM_USER "${UPSTREAM_USER:?}"
          put UPSTREAM_PASS "${UPSTREAM_PASS:?}"
          put UPSTREAM_URL "${UPSTREAM_URL:?}"
          # Slot 2 is optional. Push it only when complete — a half-populated slot would be
          # offered to viewers and fail every stream handed to it.
          if [ -n "${UPSTREAM_2_URL:-}" ] && [ -n "${UPSTREAM_2_USER:-}" ] && [ -n "${UPSTREAM_2_PASS:-}" ]; then
            put UPSTREAM_2_URL "$UPSTREAM_2_URL"
            put UPSTREAM_2_USER "$UPSTREAM_2_USER"
            put UPSTREAM_2_PASS "$UPSTREAM_2_PASS"
            echo "slot 2 synced to the edge"
          else
            echo "slot 2 not configured — edge will serve from slot 1 alone"
          fi
          # Which slots this build verified. The edge cannot determine this itself, because the
          # provider refuses our egress and streams leave as redirects it never sees the result of.
          put UPSTREAM_HEALTHY_SLOTS "${UPSTREAM_HEALTHY_SLOTS:-}"
          echo "edge env synced (healthy slots: ${UPSTREAM_HEALTHY_SLOTS:-none reported})"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main

      - name: Smoke-test the live edge
        env:
          BASE: ${{ env.EDGE_ORIGIN }}
          CLIENT_USER: ${{ vars.CLIENT_USER || secrets.CLIENT_USER }}
          CLIENT_PASS: ${{ vars.CLIENT_PASS || secrets.CLIENT_PASS }}
          CLIENT_2_USER: ${{ vars.CLIENT_2_USER || secrets.CLIENT_2_USER }}
          CLIENT_2_PASS: ${{ vars.CLIENT_2_PASS || secrets.CLIENT_2_PASS }}
        run: |
          set -euo pipefail
          # Same script that gates local changes, so CI and local can never drift apart.
          sleep 10   # let the deployment propagate
          BASE="$BASE" python3 build/verify_edge.py