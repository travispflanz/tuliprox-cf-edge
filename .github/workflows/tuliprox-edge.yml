name: Build & Deploy Tuliprox Playlist to Cloudflare Edge
on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Official Tuliprox v3.3.0 Binary
        run: |
          mkdir -p dist
          curl -fsSL -o tuliprox.tar.gz https://github.com/euzu/tuliprox/releases/download/v3.3.0/tuliprox-v3.3.0-x86_64-unknown-linux-musl.tar.gz || \
          curl -fsSL -o tuliprox https://github.com/euzu/tuliprox/releases/download/v3.3.0/tuliprox-v3.3.0-x86_64-unknown-linux-musl
          if [ -f tuliprox.tar.gz ]; then tar -xzf tuliprox.tar.gz; fi
          chmod +x tuliprox*
          mv tuliprox* ./tuliprox 2>/dev/null || true

      - name: Run Tuliprox in One-Shot CLI Mode
        env:
          PROVIDER_URL: ${{ secrets.PROVIDER_URL }}
          PROVIDER_USER: ${{ secrets.PROVIDER_USER }}
          PROVIDER_PASS: ${{ secrets.PROVIDER_PASS }}
        run: |
          ./tuliprox -c config/config.yml -i config/source.yml
          ls -lh dist/
          head -n 5 dist/playlist.m3u

      - name: Deploy Static Artifacts & Edge Auth to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=tuliprox-edge-gateway
