process_parallel: true
# One-shot CLI run: no server is started on the edge path, but Tuliprox still requires the
# api block to be present and valid. Bind loopback so an accidental run cannot expose anything.
api:
  host: 127.0.0.1
  port: 8901
  web_root: ./web
working_dir: ./work
backup_dir: ./backup
connect_timeout_secs: 15
# CI fetches explicitly; do not let a boot-time refresh race the explicit one.
update_on_boot: false
log:
  sanitize_sensitive_info: true
  log_level: info
