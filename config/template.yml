    value: 'Group ~ ".*"'
  - name: DROP_NONENG
    value: 'NOT (Group ~ "(?i)^\s*(DK|CH|ARG|AR|PL|AL|IRE|TR|PT|ES|BR|MX|IN|HR|SE|IT|NL|FR|DE|Latino|UK: Asia|USA Latin|USA Latin TELEMUNDO|USA Latin GALAVISION|USA Latin UNIMAS|USA Latin|USA Latin UNIVISION|Latino All|Latino Sports|Israel|Belgium|Syriacs Channels|Slovenia|Austria|Finland|Norway|Ukraine|Serbia|EX-YU|Montenegro|Belarus|Georgia|Chile|Honduras|El Salvador|Cuba|Ecuador|Dominican|Colombia|Bolivia|Puerto Rico|Guatemala|Nicaragua|Uruguay|Panama|Peru|Suriname|Costa Rica|Paraguay|Venezuela|Nepal|Sriacs|Kurdistan)\s*(:|$)")'  
  - name: DROP_RELIGION
    value: 'NOT (Group ~ "(?i)^\s*(USA RELIGION|UK: Religion)\s*(:|$)")'  


